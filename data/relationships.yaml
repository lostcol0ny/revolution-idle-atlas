  # --- Infinity. The Infinity page's Upgrades and Challenges are tables and are
  # swept; its Generators and Stars sections are prose and a numbered list, so no
  # table reader can see them and they are curated here instead.
  #
  # The aliases are "Gen 1", not "G1": a two-character surface form is only
  # matched when it is uppercase letters, and "G1" is not, so it would be
  # dropped. The plural "Gen 2s" is a separate surface because the matcher
  # anchors on word boundaries — "Gen 2" does not fire inside "bought Gen 2s".

  - id: infinities
    name: Infinities
    system: infinity
    kind: stat
    wiki: Infinity
    confidence: documented
    effects:
      - text: One is gained for every performed Infinity

  - id: generator-1
    name: Generator 1
    system: infinity
    kind: upgrade
    aliases: [Gen 1]
    wiki: Infinity#Generators
    confidence: documented
    effects:
      - text: Generates Generator Power
        per_level: Buying multiplies its interval by 2x

  - id: generator-2
    name: Generator 2
    system: infinity
    kind: upgrade
    aliases: [Gen 2, Gen 2s]
    wiki: Infinity#Generators
    confidence: documented
    effects:
      - text: Generates Generator 1
        per_level: Buying multiplies its interval by 2x

  - id: generator-3
    name: Generator 3
    system: infinity
    kind: upgrade
    aliases: [Gen 3, Gen 3s]
    wiki: Infinity#Generators
    confidence: documented
    effects:
      - text: Generates Generator 2
        per_level: Buying multiplies its interval by 2x

  - id: generator-4
