# Revolution Idle Atlas — relationship dataset.
# The durable half of the dataset. `data/derived.yaml` is regenerated in full by
# `atlas extract`; this file survives extraction and wins every merge, which is
# what makes it the place to correct or delete anything generated.
#
# confidence (nodes): documented | provisional | unknown
# confidence (edges): documented | provisional | uncertain
# source: wiki:<PageName> | observed | il2cpp | discord
# Edges point upstream -> downstream: 'from' boosts / unlocks / is-required-by 'to'.

# The game's own menu structure. Every node's `system` must name an id here.
systems:
  - id: revolution
    name: Revolution
  - id: infinity
    name: Infinity
  - id: eternity
    name: Eternity
  - id: unity
    name: Unity
  - id: attacks
    name: Attacks
    parent: unity
  - id: astrology
    name: Astrology
    parent: unity
  - id: trials
    name: Trials
    parent: unity
  - id: relics
    name: Relics
    parent: unity
  - id: minerals
    name: Minerals
    parent: unity
  - id: refine-tree
    name: Refine Tree
    parent: minerals
  - id: elements
    name: Elements
    parent: unity
  - id: tarot
    name: Tarot
    parent: unity
  - id: plague
    name: Plague
    parent: unity
  - id: singularity
    name: Singularity
    parent: unity
  # The Houses tab is an advanced Astrology unlocked at 32 Singularities, and
  # its zodiacs share nothing with the Astrology set but their twelve names.
  # Nested under Singularity rather than beside it, the way Refine Tree sits
  # under Minerals, because that is where the game puts the tab.
  - id: houses
    name: Houses
    parent: singularity

nodes:
  - id: attack-power
    name: Attack Power
    system: attacks
    kind: stat
    wiki: Unity#Attacks
    confidence: documented

  - id: gold
    name: Gold
    system: attacks
    kind: currency
    wiki: Unity#Attacks
    confidence: documented

  - id: singularity
    name: Singularity
    system: singularity
    kind: currency
    wiki: Singularity
    confidence: provisional

  - id: atoms-gain
    name: Atoms Gain
    aliases: [Atom Gain]
    system: singularity
    kind: stat
    wiki: Singularity
    confidence: provisional

  - id: plague
    name: Plague
    system: plague
    kind: currency
    wiki: Plague
    confidence: unknown









































































































































  # --- Infinity. The Infinity page's Upgrades and Challenges are tables and are
  # swept; its Generators and Stars sections are prose and a numbered list, so no
  # table reader can see them and they are curated here instead.
  #
  # The aliases are "Gen 1", not "G1": a two-character surface form is only
  # matched when it is uppercase letters, and "G1" is not, so it would be
  # dropped. The plural "Gen 2s" is a separate surface because the matcher
  # anchors on word boundaries — "Gen 2" does not fire inside "bought Gen 2s".

  - id: infinities
    name: Infinities
    aliases: [Infinity Gain]
    system: infinity
    kind: stat
    wiki: Infinity
    confidence: documented
    effects:
      - text: One is gained for every performed Infinity

  - id: generator-1
    name: Generator 1
    system: infinity
    kind: upgrade
    aliases: [Gen 1]
    wiki: Infinity#Generators
    confidence: documented
    effects:
