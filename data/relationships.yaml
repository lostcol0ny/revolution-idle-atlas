# Revolution Idle Atlas — relationship dataset.
# The durable half of the dataset. `data/derived.yaml` is regenerated in full by
# `atlas extract`; this file survives extraction and wins every merge, which is
# what makes it the place to correct or delete anything generated.
#
# confidence (nodes): documented | provisional | unknown
# confidence (edges): documented | provisional | uncertain
# source: wiki:<PageName> | observed | il2cpp | discord
# Edges point upstream -> downstream: 'from' boosts / unlocks / is-required-by 'to'.

# The game's own menu structure. Every node's `system` must name an id here.
systems:
  - id: revolution
    name: Revolution
  - id: infinity
    name: Infinity
  - id: eternity
    name: Eternity
  - id: unity
    name: Unity
  - id: attacks
    name: Attacks
  - id: astrology
    name: Astrology
    parent: unity
  - id: trials
    name: Trials
    parent: unity
  - id: relics
    name: Relics
    parent: unity
  - id: minerals
    name: Minerals
    parent: unity
  - id: refine-tree
    name: Refine Tree
    parent: minerals
  - id: elements
    name: Elements
    parent: unity
  - id: tarot
    name: Tarot
    parent: unity
  - id: plague
    name: Plague
    parent: unity
  - id: singularity
    name: Singularity
    parent: unity

