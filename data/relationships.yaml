  # --- Currencies. One per {{Keyword}} currency type in data/raw/, keyed on
  # the TYPE field because the label is often a quantity rather than a name:
  # {{Keyword|ep|1.08e2466 EP}}. Hand-written rather than extracted because
  # the four donut_* keyword types map onto four of these same stats, so an
  # extractor would emit derived duplicates of nodes curated here.
  # The ALL-UPPERCASE alias is what the wiki actually writes in prose;
  # Vocabulary matches it case-sensitively so it cannot fire inside a word.

  - id: eternity-points
    name: Eternity Points
    system: eternity
    kind: currency
    aliases: [EP]
    wiki: Eternity
    confidence: documented

  - id: infinity-points
