name: Daily wiki scrape

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# The app token below does every write, so the job's own GITHUB_TOKEN only ever
# needs to read the repository for the checkout.
permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # fetch_pages bounds its own continuation loop, but this job also talks to a
    # volunteer-run wiki over the network; cap it well below the 6-hour default.
    timeout-minutes: 15
    steps:
      # GitHub refuses to raise workflow events for anything the default
      # GITHUB_TOKEN did, so a PR opened with it arrives with no checks attached
      # and nothing for auto-merge to wait on. Opening it as the app instead
      # makes ci.yml fire on the PR the way it does for a human's.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SCRAPE_APP_ID }}
          private-key: ${{ secrets.SCRAPE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Third-party actions are pinned to a full commit SHA: this job holds a
      # contents:write token and runs unattended, so a moved tag would execute
      # unreviewed code with write access to the repository.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Scrape wiki
        run: uv run atlas scrape

      - name: Summarise changes
        id: summary
        run: |
          {
            echo 'body<<PRBODY'
            echo 'Automated wiki scrape, with the generated artifacts rebuilt from it. `relationships.yaml` is untouched.'
            echo ''
            echo '### New pages'
            git ls-files --others --exclude-standard data/raw/ \
              | sed 's|data/raw/|- |; s|\.wikitext$||' | grep . || echo '_none_'
            echo ''
            echo '### Changed pages'
            git diff --numstat -- data/raw/ \
              | awk '{printf "- %s (+%s/-%s)\n", $3, $1, $2}' | grep . || echo '_none_'
            echo ''
            echo '### Removed pages'
            git diff --diff-filter=D --name-only -- data/raw/ \
              | sed 's|data/raw/|- |; s|\.wikitext$||' | grep . || echo '_none_'
            echo ''
            echo '### WIP-flagged pages'
            grep -l '{{New Content}}' data/raw/*.wikitext 2>/dev/null \
              | sed 's|data/raw/|- |; s|\.wikitext$||' | grep . || echo '_none_'
            echo 'PRBODY'
          } >> "$GITHUB_OUTPUT"

      # ci.yml regenerates these and fails on any diff, so a PR carrying raw
      # wikitext alone is one that turns main red the moment it lands. Rebuilding
      # here also makes the scrape reviewable: the artifact diff is where a wiki
      # edit becomes a visible change to the graph.
      #
      # Runs after the summary so that step reads only what the scraper wrote,
      # and before the PR so a build failure stops the PR from opening at all.
      - name: Regenerate artifacts
        run: |
          uv run atlas extract
          uv run atlas build

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            data/raw
            data/derived.yaml
            public/graph.json
            docs/coverage.md
          branch: wiki-scrape
          title: "chore: daily wiki scrape"
          body: "${{ steps.summary.outputs.body }}"
          commit-message: "chore: daily wiki scrape"
          delete-branch: true

      # Queues the PR rather than merging it: auto-merge waits on whatever the
      # ruleset on main marks as required, so the required status checks are the
      # only thing standing between a wiki edit and production. Loosen them and
      # this becomes an unattended push to main.
      #
      # Skipped when the scrape found nothing, in which case no PR was opened
      # and the step output is empty.
      - name: Queue the pull request for merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --squash --auto
